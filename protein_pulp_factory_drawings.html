*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{white-space:nowrap;border:0;background:transparent;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tag{position:fixed;z-index:5;pointer-events:none;padding:0 18px}
.tag .nm{font:600 1.05rem/1.2 "Barlow Semi Condensed",sans-serif}
.tag .ds{color:var(--muted);font-size:.84rem}
.tag .cap{font:600 2.6rem/1.05 "Barlow Semi Condensed",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:6px}
.tag .sub2{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tag .dl{font-weight:600} .dl.down{color:var(--good)} .dl.up{color:var(--bad)}

#areasBox table{border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums;margin:0 14px 12px}
#areasBox th,#areasBox td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
#areasBox th:first-child,#areasBox td:first-child{text-align:left}
#areasBox th{font-weight:600;color:var(--muted);font-size:.78rem}
#areasBox tr.tot td{font-weight:600;border-bottom:0}
#areasBox .sw{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:7px}
#areasBody[hidden]{display:none}
#card{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:330px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px 18px;z-index:7;backdrop-filter:blur(8px)}
#card[hidden]{display:none}

// ---------- build both plants ----------
function use(pl){ scene=pl.scene; items=pl.byId; groups=pl.groups; structure=pl.structure; }
function drawFootprint(pl){
  const bb=new THREE.Box3(); Object.values(pl.groups).forEach(g=>bb.expandByObject(g)); pl.structure.forEach(g=>bb.expandByObject(g));
  const m=5, x0=bb.min.x-m, x1=bb.max.x+m, z0=bb.min.z-m, z1=bb.max.z+m, w=x1-x0, d=z1-z0; pl.foot=w*d;
  pl.slab.scale.set(w,1,d); pl.slab.position.set((x0+x1)/2,-.3,(z0+z1)/2);
  if(pl.outline) pl.scene.remove(pl.outline); if(pl.dim){pl.scene.remove(pl.dim); pl.dim.material.map.dispose();}
  const mat=new THREE.LineDashedMaterial({dashSize:2,gapSize:1.4,color:cssVar('--ink')});
  pl.outline=new THREE.Line(new THREE.BufferGeometry().setFromPoints([[x0,z0],[x1,z0],[x1,z1],[x0,z1],[x0,z0]].map(([x,z])=>new THREE.Vector3(x,.06,z))),mat); pl.outline.computeLineDistances(); pl.scene.add(pl.outline);
  const cv=document.createElement('canvas'), ctx=cv.getContext('2d'), txt=`${Math.round(w)} ft × ${Math.round(d)} ft  =  ${Math.round(w*d).toLocaleString('en-US')} sq ft`;
  ctx.font='600 64px "Barlow Semi Condensed", sans-serif'; cv.width=Math.ceil(ctx.measureText(txt).width+20); cv.height=96; ctx.font='600 64px "Barlow Semi Condensed", sans-serif';
  ctx.fillStyle=cssVar('--ink'); ctx.textBaseline='middle'; ctx.fillText(txt,10,50);
  const tex=new THREE.CanvasTexture(cv); tex.anisotropy=8; const pw=Math.min(w*.6,cv.width/96*6), ph=pw*96/cv.width;
  pl.dim=new THREE.Mesh(new THREE.PlaneGeometry(pw,ph),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false})); pl.dim.rotation.x=-Math.PI/2; pl.dim.position.set(x0+pw/2+1,.1,z1+ph/2+1.5); pl.scene.add(pl.dim);
}

let colorBy='area', selId=null;

function recolor(){ PLANS.forEach(pl=>pl.items.forEach(it=>{ if(!it.m) return;
  const c=colorBy==='area'?new THREE.Color(AREAS[it.area][1]):(it.changed?newCol.clone():oldCol.clone()); const s=it.id===selId;
  it.m[0].color.copy(c); it.m[1].color.copy(c).multiplyScalar(.62); it.m.forEach(m=>{m.emissive.set(s?0xf2b705:0); m.emissiveIntensity=s?.55:0;}); })); }

const $=id=>document.getElementById(id);
function renderCosts(){
  const [a,b]=PLANS, d=(b.eq-a.eq)*LANG;
  PLANS.forEach((pl,i)=>{ $(i?'tagR':'tagL').innerHTML=`<div class="nm">${pl.name}</div><div class="ds">${pl.desc}</div><div class="cap">${fmtM(pl.eq*LANG)}</div>
    <div class="sub2">CAPEX at Lang ${LANG.toFixed(1)}  |  ${Math.round(pl.foot).toLocaleString('en-US')} sq ft${i?`  |  <span class="dl ${d<0?'down':'up'}">${d<0?'':'+'}${fmtK(d)} vs original</span>`:''}</div>`; });
  const rows=Object.entries(AREAS).filter(([k])=>k!=='700').map(([k,[n,col]])=>{ const v=PLANS.map(pl=>pl.items.filter(x=>String(x.area)===k).reduce((s,x)=>s+x.p,0)*LANG), dd=v[1]-v[0];
    return `<tr><td><span class="sw" style="background:${col}"></span>${k} ${n}</td><td>${fmtK(v[0])}</td><td>${fmtK(v[1])}</td><td>${Math.round(dd)?(dd>0?'+':'')+fmtK(dd):'—'}</td></tr>`; }).join('');
  $('areasTb').innerHTML=rows+`<tr class="tot"><td>Total CAPEX</td><td>${fmtK(a.eq*LANG)}</td><td>${fmtK(b.eq*LANG)}</td><td>${d>0?'+':''}${fmtK(d)}</td></tr>`;
  if(selId) showCard(selId, lastPlan);
}

  const barH=$('bar').getBoundingClientRect().bottom+8;
  vps.forEach((v,i)=>{ const t=$(i?'tagR':'tagL'); t.style.left=v.x+'px'; t.style.width=v.w+'px'; t.style.top=(stack?v.y+6:barH)+'px'; });
  const dv=$('divider'); if(stack){Object.assign(dv.style,{left:'0',width:'100%',top:vps[1].y+'px',height:'1px'});} else {Object.assign(dv.style,{left:(w/2)+'px',width:'1px',top:'0',height:'100%'});}
}
addEventListener('resize',layout); layout(); (document.fonts?document.fonts.ready:Promise.resolve()).then(layout);

// ---------- picking ----------
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
function pick(e){ const r=renderer.domElement.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  const i=vps.findIndex(v=>x>=v.x&&x<v.x+v.w&&y>=v.y&&y<v.y+v.h); if(i<0) return null; const v=vps[i], pl=PLANS[i];
  ptr.set((x-v.x)/v.w*2-1,-(y-v.y)/v.h*2+1); ray.setFromCamera(ptr,camera);
  const h=ray.intersectObjects(pl.items.flatMap(d=>d.meshes||[]),false)[0]; return h?{id:h.object.userData.id,pl}:null; }
let down=null; renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{ if(!down) return; if(Math.hypot(e.clientX-down.x,e.clientY-down.y)<5){ const h=pick(e);
  if(h){ selId=h.id; recolor(); showCard(h.id,h.pl); } else { selId=null; $('card').hidden=true; recolor(); } } down=null; });
const tip=$('tip'); let hq=null; renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerType==='mouse') hq=e;}); renderer.domElement.addEventListener('pointerleave',()=>{tip.hidden=true; hq=null;});
function hover(){ if(!hq) return; const e=hq; hq=null; const h=pick(e);
  if(h){ const d=h.pl.byId[h.id]; tip.textContent=`${d.tag}  ${d.name}`; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.hidden=false; renderer.domElement.style.cursor='pointer'; }
  else { tip.hidden=true; renderer.domElement.style.cursor=''; } }

function loop(){ requestAnimationFrame(loop); controls.update(); hover(); const H=stage.clientHeight;
  vps.forEach((v,i)=>{ const y=H-v.y-v.h; renderer.setViewport(v.x,y,v.w,v.h); renderer.setScissor(v.x,y,v.w,v.h); renderer.render(PLANS[i].scene,camera); }); }
recolor(); setLang(1); loop();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{PLANS.forEach(drawFootprint); renderCosts();});
</script>
